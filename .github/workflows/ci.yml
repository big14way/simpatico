name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard (no env files, private notes, keys or Qloo response data)
        run: bash scripts/guard.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: No server-only modules in browser bundles
        run: |
          if grep -rl "node:net\|undici" apps/web/.next/static/chunks; then
            echo "A client bundle pulls in server-only code (the Qloo gateway)."; exit 1
          fi
